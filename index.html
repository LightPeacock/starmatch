<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarMatch | Discover Your Cosmic Connection</title>

  <!-- CSS -->
  <link rel="stylesheet" href="assets/styles.css" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* Inlined fallback styles (in case styles.css fails to load) */
    body {
      background: radial-gradient(circle at top, #1a0033, #000);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #ff80bf, #9580ff, #80ffea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 1.1rem;
      max-width: 600px;
      margin-bottom: 2rem;
      color: #ccc;
    }
    .start-btn {
      background: linear-gradient(90deg, #ff80bf, #9580ff);
      border: none;
      color: white;
      padding: 14px 30px;
      font-size: 1.1rem;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
    }
    .start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 128, 191, 0.6);
    }
    footer {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 0.85rem;
      color: #777;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>💫 Welcome to StarMatch</h1>
    <p>Discover your <strong>Love Persona</strong> and find which <strong>month</strong> or <strong>zodiac sign</strong> matches your emotional energy.  
      Answer a few questions about your personality, and let the stars guide your love path.</p>

    <a href="quiz.html" class="start-btn">Start the Quiz ✨</a>
  </div>

  <footer>
    © 2025 StarMatch | Made with 💜 under the stars
  </footer>

</body>
</html>
