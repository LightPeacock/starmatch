<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarMatch | Your Love Persona</title>

  <link rel="stylesheet" href="assets/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      background: radial-gradient(circle at top, #100028, #000);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    .result-container {
      max-width: 700px;
      margin: 80px auto;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 0 30px rgba(128, 255, 234, 0.2);
    }
    h2 {
      font-size: 2rem;
      margin-bottom: 1rem;
      background: linear-gradient(90deg, #ff80bf, #9580ff, #80ffea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .persona {
      font-size: 1.3rem;
      margin: 1.2rem 0;
      color: #ffd6ff;
    }
    .month {
      font-size: 1.2rem;
      color: #80ffea;
    }
    .desc {
      margin: 1.5rem 0;
      color: #ccc;
    }
    .back-btn {
      background: linear-gradient(90deg, #80ffea, #9580ff);
      border: none;
      padding: 12px 30px;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
      color: #000;
      transition: all 0.3s ease;
      text-decoration: none;
    }
    .back-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(128, 255, 234, 0.6);
    }
    footer {
      margin-top: 40px;
      font-size: 0.85rem;
      color: #777;
    }
  </style>
</head>
<body>

  <div class="result-container">
    <h2>Your Love Persona ✨</h2>
    <div id="persona" class="persona">Loading...</div>
    <div id="month" class="month"></div>
    <p id="desc" class="desc"></p>
    <a href="index.html" class="back-btn">🔁 Try Again</a>
  </div>

  <footer>
    © 2025 StarMatch | Written in the stars 💫
  </footer>

  <script src="assets/matchEngine.js"></script>
</body>
</html>
