<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarMatch | Personality Quiz</title>

  <!-- Styles -->
  <link rel="stylesheet" href="assets/styles.css" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      background: radial-gradient(circle at top, #0f001f, #000);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    .quiz-container {
      max-width: 700px;
      margin: 80px auto;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 0 30px rgba(255, 128, 191, 0.2);
    }
    h2 {
      font-size: 1.6rem;
      margin-bottom: 1.5rem;
    }
    .option {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #fff;
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    .option:hover {
      background: linear-gradient(90deg, #ff80bf, #9580ff);
      transform: scale(1.03);
    }
    #nextBtn {
      margin-top: 20px;
      background: linear-gradient(90deg, #80ffea, #9580ff);
      border: none;
      padding: 12px 30px;
      border-radius: 30px;
      font-size: 1.1rem;
      cursor: pointer;
      color: #000;
      display: none;
      transition: all 0.3s ease;
    }
    #nextBtn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(128, 255, 234, 0.6);
    }
    footer {
      margin-top: 40px;
      font-size: 0.85rem;
      color: #777;
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    <h2 id="question">Loading question...</h2>
    <div id="options"></div>
    <button id="nextBtn">Next ➜</button>
  </div>

  <footer>
    © 2025 StarMatch | Your cosmic match awaits ✨
  </footer>

  <script src="assets/quiz.js"></script>
</body>
</html>
